name: Auto Organize LeetCode Files

on:
  push:
    branches:
      - main

jobs:
  organize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    # 1. Tải toàn bộ lịch sử git về
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Bỏ qua nếu commit này do chính github-actions[bot] tạo ra (tránh loop)
    - name: Check commit author
      id: check_author
      run: |
        AUTHOR=$(git log -1 --pretty=format:'%an')
        if [ "$AUTHOR" = "github-actions[bot]" ]; then
          echo "Skip vì commit này vừa được tạo bởi bot."
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "skip=false" >> $GITHUB_OUTPUT
        fi

    # 3. Cài đặt Python
    - name: Set up Python
      if: steps.check_author.outputs.skip == 'false'
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 4. Chạy script dọn dẹp thư mục
    - name: Run Organize Bot
      if: steps.check_author.outputs.skip == 'false'
      run: python organize_leetcode.py
      continue-on-error: true

    # 5. Commit và Push giữ nguyên 100% commit message gốc
    - name: Commit and Push changes
      if: steps.check_author.outputs.skip == 'false'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 1. Trích xuất toàn bộ nội dung commit message gốc (kể cả multiline) vào file tạm
        git log -1 --pretty=format:%B > /tmp/original_commit_msg.txt
        
        # 2. Stage toàn bộ thay đổi
        git add .
        
        # 3. Kiểm tra xem có thay đổi nào cần commit không
        if ! git diff-index --quiet HEAD; then
          # Commit bằng nội dung đọc từ file để giữ nguyên toàn bộ Runtime/Memory/Time Complexity
          git commit -F /tmp/original_commit_msg.txt
          git push
        else
          echo "Không có file nào cần di chuyển."
        fi
