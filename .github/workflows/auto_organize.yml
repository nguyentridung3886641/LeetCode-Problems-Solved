name: Auto Organize LeetCode Files

on:
  push:
    branches:
      - main # Hoặc master tùy theo nhánh chính của repo bạn

jobs:
  organize:
    runs-on: ubuntu-latest
    
    # Cấp quyền cho GitHub Actions được phép ghi và push code ngược lại repo
    permissions:
      contents: write

    steps:
    # 1. Tải code từ repo về máy ảo của GitHub
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Cài đặt môi trường Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. Gọi con bot dậy để nó dọn dẹp thư mục
    - name: Run Organize Bot
      id: run_bot
      run: python organize_leetcode.py
      continue-on-error: true # Nếu bot trả về exit 1 (không có file mới) thì bỏ qua bước dưới

    # 4. Nếu bot dời file thành công, GitHub tự động commit và lưu lại
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        # Chỉ commit nếu thực sự có sự thay đổi thư mục
        git diff-index --quiet HEAD || git commit -m "Automation: Phân loại bài giải LeetCode vào thư mục độ khó"
        git push
