name: Update LeetCode Stats SVG

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Script Python To Render SVG
        run: python update_stats.py

      - name: Auto Commit and Push File SVG
        env:
          # Nạp token bảo mật vào biến môi trường của hệ thống
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add leetcode_stats.svg
          
          # Nếu có sự thay đổi mới tiến hành commit và push dùng token xác thực trực tiếp
          if ! git diff-index --quiet HEAD; then
            git commit -m "🤖 [Bot] Tự động cập nhật đồ thị LeetCode"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
          fi
