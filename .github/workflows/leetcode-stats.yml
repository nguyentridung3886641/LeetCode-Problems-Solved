name: Update LeetCode Stats SVG

on:
  schedule:
    - cron: '0 0 * * *' # Tự động chạy hàng ngày
  workflow_dispatch: # Cho phép bấm chạy thủ công

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-with-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Script Python To Render SVG
        run: python update_stats.py

      - name: Auto Commit and Push File SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add leetcode_stats.svg
          git diff-index --quiet HEAD || git commit -m "🤖 [Bot] Tự động cập nhật đồ thị LeetCode"
          git push
