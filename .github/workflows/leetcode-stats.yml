name: Update LeetCode Stats SVG

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Cấp token xác thực quyền push code

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x' # Đã sửa lại cú pháp chuẩn của tham số này

      - name: Install Dependencies
        run: pip install requests

      - name: Run Script Python To Render SVG
        run: python update_stats.py

      - name: Auto Commit and Push File SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add leetcode_stats.svg
          git diff-index --quiet HEAD || git commit -m "🤖 [Bot] Tự động cập nhật đồ thị LeetCode"
          git push origin main
