name: Update LeetCode Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Update LeetCode Stats Badge
        uses: swapna-6/leetcode-stats-action@v1.0.1
        with:
          username: nguyentridung3886641
          filename: README.md
